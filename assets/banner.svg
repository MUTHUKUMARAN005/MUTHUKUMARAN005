<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814">
        <animate attributeName="stop-color" values="#050814;#071428;#12061f;#050814" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#0b1238"/>
      <stop offset="100%" stop-color="#1a0728">
        <animate attributeName="stop-color" values="#1a0728;#0a1a4a;#2a0a40;#1a0728" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#00d4ff"/>
      <animate attributeName="x1" values="-50%;50%;-50%" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="50%;150%;50%" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/><stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="520" fill="url(#bg)"/>

  <!-- perspective grid -->
  <g opacity="0.18" stroke="#00d4ff" stroke-width="1" fill="none">
    <path d="M0 420 L800 300 L1600 420"/>
    <path d="M0 460 L800 320 L1600 460"/>
    <path d="M0 500 L800 340 L1600 500"/>
    <path d="M200 520 L800 300 L1400 520" opacity="0.5"/>
    <line x1="800" y1="260" x2="800" y2="520" stroke-width="1.2"/>
    <animate attributeName="opacity" values="0.12;0.28;0.12" dur="5s" repeatCount="indefinite"/>
  </g>

  <!-- ambient orbs -->
  <circle cx="180" cy="120" r="90" fill="#00d4ff" opacity="0.07" filter="url(#glowSoft)">
    <animate attributeName="r" values="80;110;80" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1420" cy="160" r="110" fill="#7c3aed" opacity="0.09" filter="url(#glowSoft)">
    <animate attributeName="r" values="100;130;100" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- particles -->
  <g fill="#67e8f9">
    <circle cx="120" cy="80" r="2"><animate attributeName="cy" values="80;60;80" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="200" r="1.5"><animate attributeName="cy" values="200;170;200" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.9;0.15" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="90" r="2.2"><animate attributeName="cy" values="90;70;90" dur="3.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1280" cy="240" r="1.8"><animate attributeName="cy" values="240;215;240" dur="4.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="70" r="1.4"><animate attributeName="cy" values="70;50;70" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="1500" cy="80" r="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="180" r="1.6" fill="#a78bfa"><animate attributeName="cy" values="180;155;180" dur="4.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ISOMETRIC CUBE 1 -->
  <g filter="url(#glow)" opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -16; 0 0" dur="4.2s" repeatCount="indefinite"/>
    <polygon points="220,210 280,180 340,210 280,240" fill="url(#faceTop)"/>
    <polygon points="220,210 280,240 280,300 220,270" fill="url(#faceLeft)"/>
    <polygon points="340,210 280,240 280,300 340,270" fill="url(#faceRight)"/>
  </g>

  <!-- CUBE 2 -->
  <g filter="url(#glow)" opacity="0.88">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -22; 0 0" dur="5s" begin="0.6s" repeatCount="indefinite"/>
    <polygon points="1280,250 1328,226 1376,250 1328,274" fill="url(#faceTop)"/>
    <polygon points="1280,250 1328,274 1328,322 1280,298" fill="url(#faceLeft)"/>
    <polygon points="1376,250 1328,274 1328,322 1376,298" fill="url(#faceRight)"/>
  </g>

  <!-- CUBE 3 small -->
  <g filter="url(#glow)" opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0" dur="3.4s" begin="1.1s" repeatCount="indefinite"/>
    <polygon points="148,320 180,304 212,320 180,336" fill="url(#faceTop)"/>
    <polygon points="148,320 180,336 180,368 148,352" fill="url(#faceLeft)"/>
    <polygon points="212,320 180,336 180,368 212,352" fill="url(#faceRight)"/>
  </g>

  <!-- CUBE 4 -->
  <g filter="url(#glow)" opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -18; 0 0" dur="4.8s" begin="0.3s" repeatCount="indefinite"/>
    <polygon points="1410,360 1450,340 1490,360 1450,380" fill="url(#faceTop)"/>
    <polygon points="1410,360 1450,380 1450,420 1410,400" fill="url(#faceLeft)"/>
    <polygon points="1490,360 1450,380 1450,420 1490,400" fill="url(#faceRight)"/>
  </g>

  <!-- CUBE 5 wireframe -->
  <g fill="none" stroke="#67e8f9" stroke-width="1.4" opacity="0.55">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="6s" begin="1.8s" repeatCount="indefinite"/>
    <polygon points="430,380 470,360 510,380 470,400"/>
    <polygon points="430,380 470,400 470,440 430,420"/>
    <polygon points="510,380 470,400 470,440 510,420"/>
  </g>

  <!-- scan line -->
  <rect x="0" y="0" width="1600" height="2" fill="#00d4ff" opacity="0.25">
    <animate attributeName="y" values="0;520;0" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.35;0" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- name -->
  <text x="800" y="195" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="8" fill="url(#neon)" filter="url(#textGlow)">MUTHUKUMARAN N</text>
  <text x="800" y="198" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="8" fill="#e8faff" opacity="0.92">MUTHUKUMARAN N</text>

  <text x="800" y="250" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" letter-spacing="6" fill="#67e8f9" opacity="0.95">SOFTWARE ENGINEER  ·  FULL-STACK DEVELOPER</text>
  <text x="800" y="292" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" letter-spacing="3" fill="#c4b5fd">JAVA SPRING BOOT  ·  REACT.JS  ·  AI / CLOUD  ·  DEVOPS</text>

  <!-- neon underline -->
  <rect x="520" y="312" width="560" height="2" rx="1" fill="url(#neon)" filter="url(#glow)">
    <animate attributeName="width" values="200;560;200" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="700;520;700" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="800" y="360" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" letter-spacing="4" fill="#94a3b8">CHENNAI, INDIA  ·  OPEN TO OPPORTUNITIES</text>
</svg>