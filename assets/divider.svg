<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 40" width="900" height="40">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1;-1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="50" y="18" width="800" height="2" fill="url(#g)"/>
  <circle cx="450" cy="19" r="4" fill="#00d4ff">
    <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>